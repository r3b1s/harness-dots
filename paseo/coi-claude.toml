# Coi configuration for Paseo's `claude-coi` custom provider.
# Loaded via COI_CONFIG by $PASEO_HOME/bin/claude-coi.

[container]
image = "coi-default"

[paths]
preserve_workspace_path = true

[network]
# Open mode avoids interactive sudo prompts for nftables when launched by the Paseo daemon.
mode = "open"

[security]
# Host user lacks CAP_LINUX_IMMUTABLE on /usr/local/bin/coi; rely on read-only bind mounts.
host_immutable = false

[[credentials]]
bundle = "claude"

[[mounts.default]]
host = "$PASEO_HOME/coi-claude/projects"
container = "/home/code/.claude/projects"
readonly = false
