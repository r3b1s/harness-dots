# Command Code CLI (`cmd`) with a controllable desktop, on the
# `coi-agy-desktop` image (build it with `coi build --profile agy-desktop`).
#
# Login and settings are copied in from the host's ~/.commandcode at session
# start (log in on the host with `cmd login`); transcripts persist under
# $COI_HOME/state/commandcode/projects so sessions can be resumed.

[container]
image = "coi-agy-desktop"

[paths]
preserve_workspace_path = true

[network]
# Open mode avoids interactive sudo prompts for nftables when launched headless.
mode = "open"

[security]
# Host user lacks CAP_LINUX_IMMUTABLE on /usr/local/bin/coi; rely on read-only bind mounts.
host_immutable = false

# Lets processes started by `coi run`/`coi shell` reach the desktop session that
# systemd --user runs for `code` (uid 1000).
[environment]
DISPLAY = ":0"
XDG_RUNTIME_DIR = "/run/user/1000"
DBUS_SESSION_BUS_ADDRESS = "unix:path=/run/user/1000/bus"

# Selkies remote desktop, published on 127.0.0.1 with a host port allocated per
# workspace/slot (COI_PORT_DESKTOP inside; `coi-desktop url` on the host).
[ports]
map = [{ name = "desktop", container = 8080 }]

[[credentials]]
host = "~/.commandcode/auth.json"
container = "/home/code/.commandcode/auth.json"
mode = "0600"

[[credentials]]
host = "~/.commandcode/config.json"
container = "/home/code/.commandcode/config.json"
mode = "0600"

[[mounts]]
host = "$COI_HOME/state/commandcode/projects"
container = "/home/code/.commandcode/projects"
readonly = false
