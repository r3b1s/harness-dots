# Base desktop profile: builds the `coi-desktop` image (coi-default + Xvfb, i3,
# AT-SPI, Selkies/Pixelflux, computer-use-linux, Chromium; see build.sh) and
# runs it with no agent-specific state. The harness profiles (claude-desktop,
# agy-desktop, commandcode-desktop) repeat the [environment] and [ports] below
# instead of using `inherits`, which replaces [[mounts]] rather than appending.
#
# No profile mounts a browser seed. `coi-desktop run --seed NAME -- <coi args>`
# adds one per launch (read-only; writable for `coi-desktop seed login`), so
# each session sees only the logins of the seed it was started with.
#
#   coi build --profile desktop
#   coi-desktop run --seed NAME -- shell --profile desktop --debug

[container]
image = "coi-desktop"

[container.build]
base = "coi-default"
script = "build.sh"

[paths]
preserve_workspace_path = true

[network]
# Open mode avoids interactive sudo prompts for nftables when launched headless.
mode = "open"

[security]
# Host user lacks CAP_LINUX_IMMUTABLE on /usr/local/bin/coi; rely on read-only bind mounts.
host_immutable = false

# Lets processes started by `coi run`/`coi shell` reach the desktop session that
# systemd --user runs for `code` (uid 1000).
[environment]
DISPLAY = ":0"
XDG_RUNTIME_DIR = "/run/user/1000"
DBUS_SESSION_BUS_ADDRESS = "unix:path=/run/user/1000/bus"

# Selkies remote desktop, published on 127.0.0.1 with a host port allocated per
# workspace/slot (COI_PORT_DESKTOP inside; `coi-desktop url` on the host).
[ports]
map = [{ name = "desktop", container = 8080 }]
